min_version: 2.2.2
lefthook: ./node_modules/.bin/lefthook
assert_lefthook_installed: true

pre-commit:
  jobs:
    - name: arquivos-versionados
      run: node scripts/quality/check-staged.mjs
    - name: lint-formatacao-preparados
      run: node scripts/quality/staged-quality.mjs

commit-msg:
  jobs:
    - name: conventional-commits
      run: node scripts/quality/commit-message.mjs "{1}"

pre-push:
  jobs:
    - name: qualidade-local
      use_stdin: true
      run: node scripts/quality/pre-push.mjs
