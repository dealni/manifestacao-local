# Instalar como /etc/nginx/sites-available/manifestacao-local e criar symlink
# em sites-enabled. Este arquivo pertence ao contexto http do nginx.
map $http_upgrade $manifestacao_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name manifestacoes.com www.manifestacoes.com;
    return 301 https://manifestacoes.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.manifestacoes.com;
    ssl_certificate /etc/ssl/manifestacao-local/origin.pem;
    ssl_certificate_key /etc/ssl/manifestacao-local/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://manifestacoes.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manifestacoes.com;
    include /etc/nginx/snippets/manifestacao-cloudflare-realip.conf;
    ssl_certificate /etc/ssl/manifestacao-local/origin.pem;
    ssl_certificate_key /etc/ssl/manifestacao-local/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Upload de até 20 MiB pode chegar como JSON/base64 (~27 MiB).
    client_max_body_size 32m;
    client_body_timeout 30s;
    send_timeout 60s;

    # Mantém logs dedicados sem query strings, cookies ou tokens de sessão.
    access_log off;
    error_log /var/log/nginx/manifestacao-local-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host manifestacoes.com;
        proxy_set_header X-Forwarded-Host manifestacoes.com;
        proxy_set_header X-Forwarded-Proto https;
        # Não propagar uma cadeia fornecida pelo cliente. O nginx pode usar
        # real_ip apenas para faixas oficiais do Cloudflare, configuradas à parte.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $manifestacao_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
